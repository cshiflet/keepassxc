name: Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - browser-multi-db

jobs:
  build:
    name: Build KeePassXC for Windows x64
    runs-on: windows-2022

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Sync runner vcpkg to pinned baseline
        shell: pwsh
        run: |
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch --depth 1 origin 66c0373dc7fca549e5803087b9487edfe3aca0a1
          git -C "$env:VCPKG_INSTALLATION_ROOT" checkout 66c0373dc7fca549e5803087b9487edfe3aca0a1
          & "$env:VCPKG_INSTALLATION_ROOT/bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DWITH_XC_ALL=OFF `
            -DWITH_XC_AUTOTYPE=ON `
            -DWITH_XC_BROWSER=ON `
            -DWITH_XC_BROWSER_PASSKEYS=ON `
            -DWITH_XC_NETWORKING=ON `
            -DWITH_XC_UPDATECHECK=OFF `
            -DWITH_XC_DOCS=OFF `
            -DWITH_TESTS=ON `
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      - name: Build
        shell: pwsh
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Run TestBrowser
        shell: pwsh
        continue-on-error: true
        run: ctest --test-dir build -C RelWithDebInfo -R "TestBrowser|TestPasskeys" --output-on-failure

      - name: Install
        shell: pwsh
        run: cmake --install build --config RelWithDebInfo

      - name: Package
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'set\(KEEPASSXC_VERSION\s+"([^"]+)"').Matches.Groups[1].Value
          if (-not $version) { $version = "snapshot" }
          $sha = "${{ github.sha }}".Substring(0,7)
          Compress-Archive -Path install/* -DestinationPath "keepassxc-browser-multi-db-$sha.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keepassxc-windows-x64-browser-multi-db
          path: keepassxc-browser-multi-db-*.zip
          retention-days: 14
          if-no-files-found: error

name: Linux build

on:
  workflow_dispatch:
  push:
    branches:
      - browser-multi-db

jobs:
  build:
    name: Build KeePassXC for Linux x64
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake g++ ninja-build \
            qtbase5-dev qtbase5-private-dev qttools5-dev qttools5-dev-tools \
            libqt5svg5-dev libqt5x11extras5-dev \
            libargon2-dev libbotan-2-dev libgcrypt20-dev libsodium-dev \
            libkeyutils-dev libminizip-dev libqrencode-dev \
            libreadline-dev libpcsclite-dev libusb-1.0-0-dev \
            libxi-dev libxtst-dev zlib1g-dev

      - name: Configure
        run: |
          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install \
            -DWITH_XC_AUTOTYPE=ON \
            -DWITH_XC_BROWSER=ON \
            -DWITH_XC_BROWSER_PASSKEYS=ON \
            -DWITH_XC_NETWORKING=ON \
            -DWITH_XC_UPDATECHECK=OFF \
            -DWITH_XC_DOCS=OFF \
            -DWITH_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run TestBrowser
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build -R "TestBrowser|TestPasskeys" --output-on-failure

      - name: Install
        run: cmake --install build

      - name: Package
        run: |
          sha=$(echo "${{ github.sha }}" | cut -c1-7)
          tar -czf "keepassxc-linux-x64-browser-multi-db-$sha.tar.gz" -C install .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: keepassxc-linux-x64-browser-multi-db
          path: keepassxc-linux-x64-browser-multi-db-*.tar.gz
          retention-days: 14
          if-no-files-found: error
